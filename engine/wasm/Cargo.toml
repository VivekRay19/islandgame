[package]
name    = "island-engine-wasm"
version = "0.2.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

# wasm-bindgen only. No macroquad/miniquad, no uuid, no getrandom, no rand:
# the engine owns its RNG and the browser owns rendering (PixiJS).
[dependencies]
island-core = { path = "../core" }
wasm-bindgen = "0.2"
serde_json = "1"
