[package]
name    = "cultural-islands-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "cultural-islands-server"
path = "src/main.rs"

[dependencies]
actix-web    = "4"
actix-ws     = "0.3"
actix-files  = "0.6"
actix-cors   = "0.7"
tokio        = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures-util = "0.3"

sqlx = { version = "0.7", features = [
    "runtime-tokio-rustls", "postgres",
    "chrono", "uuid", "json"
] }

serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
chrono      = { version = "0.4", features = ["serde"] }
uuid        = { version = "1",   features = ["v4", "serde"] }
jsonwebtoken = "9"
bcrypt       = "0.15"
tracing      = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow      = "1"
dotenvy     = "0.15"
num_cpus    = "1"
rand        = "0.8"
