[package]
name    = "cultural_islands_client"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "cultural_islands_client"
path = "src/main.rs"

[dependencies]
macroquad  = "0.3"
quad-net   = "0.0.6"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"   # optimise for size (WASM)
