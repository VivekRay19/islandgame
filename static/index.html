<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Cultural Islands</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background: #12200c;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #f0f6fc;
    }
    /* gl.js sizes the drawing buffer from the canvas' CSS size, so it must fill the window */
    #glcanvas {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      display: block;
      touch-action: none;
      outline: none;
    }
    #status-overlay {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      background: rgba(22, 27, 34, 0.92);
      padding: 28px 36px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      max-width: 85%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      transition: opacity 0.4s ease, visibility 0.4s ease;
      z-index: 9999;
    }
    .hidden { opacity: 0 !important; visibility: hidden !important; pointer-events: none !important; }
    .spinner {
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top: 3px solid #58a6ff;
      border-radius: 50%;
      width: 36px; height: 36px;
      animation: spin 0.9s linear infinite;
      margin: 0 auto 16px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <canvas id="glcanvas" tabindex="1"></canvas>

  <div id="status-overlay">
    <div id="spinner" class="spinner"></div>
    <div id="status-title" style="font-weight:600;font-size:1.1rem;">Loading Cultural Islands...</div>
    <div id="status-desc" style="font-size:.88rem;color:#8b949e;margin-top:8px;">Starting engine...</div>
  </div>

  <!-- Miniquad runtime. ORDER MATTERS: gl.js first, then plugins, then load().
       gl.js looks up #glcanvas immediately, so these must come after the <canvas>. -->
  <script src="gl.js?v=3"></script>
  <script src="sapp_jsutils.js?v=3"></script>
  <script src="audio.js?v=3"></script>
  <script src="quad-net.js?v=3"></script>

  <script>
    (function () {
      'use strict';
      var WASM = 'cultural_islands_client.wasm?v=3';

      function $(id) { return document.getElementById(id); }
      function fail(title, desc) {
        var sp = $('spinner'); if (sp) sp.style.display = 'none';
        $('status-title').innerText = title;
        $('status-title').style.color = '#f85149';
        $('status-desc').innerText = desc;
        $('status-overlay').classList.remove('hidden');
      }

      // Hide the overlay the moment the WASM module has been instantiated
      // (gl.js calls every plugin's on_init() right before main()).
      miniquad_add_plugin({
        register_plugin: function () {},
        on_init: function () { $('status-overlay').classList.add('hidden'); },
        name: 'loading_overlay',
        version: 1
      });

      // Surface JS / WASM runtime errors on screen instead of a silent blank page.
      window.addEventListener('error', function (e) {
        if (e && e.message) { fail('Runtime error', e.message); }
      });
      var origErr = console.error;
      console.error = function () {
        origErr.apply(console, arguments);
        var m = Array.prototype.join.call(arguments, ' ');
        if (m.indexOf('WASM failed to load') !== -1) {
          fail('Could not start the game', 'See the browser console (F12) for details. Is cultural_islands_client.wasm in static/?');
        }
      };

      // Pre-flight: make sure the wasm file exists and is really wasm before handing it to gl.js.
      fetch(WASM, { cache: 'no-cache' }).then(function (res) {
        if (!res.ok) { throw new Error('HTTP ' + res.status + ' for ' + WASM + ' - run "make build-client" and restart the service.'); }
        return res.arrayBuffer();
      }).then(function (buf) {
        var magic = new Uint8Array(buf, 0, 4);
        if (magic[0] !== 0 || magic[1] !== 0x61 || magic[2] !== 0x73 || magic[3] !== 0x6d) {
          throw new Error(WASM + ' is not a WebAssembly binary.');
        }
        $('status-desc').innerText = 'Starting game...';
        load(WASM);
      }).catch(function (err) {
        fail('Could not load the game', err.message || String(err));
      });
    })();
  </script>
</body>
</html>
