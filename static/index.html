<!DOCTYPE html>
<html lang="en">

<head>
  <script>
    (function () {
      function generateUUID() {
        return ([1e7] + -1e3 + -4e3 + -8e3 + -1e11).replace(/[018]/g, function (c) {
          return (c ^ (Math.random() * 16 >> (c / 4))).toString(16);
        });
      }

      var g = typeof globalThis !== 'undefined' ? globalThis : (typeof window !== 'undefined' ? window : self);

      if (!g.crypto) {
        g.crypto = {};
      }

      if (typeof g.crypto.randomUUID !== 'function') {
        g.crypto.randomUUID = generateUUID;
      }

      if (typeof window !== 'undefined') {
        if (!window.crypto) window.crypto = g.crypto;
        window.crypto.randomUUID = generateUUID;
        if (typeof Crypto !== 'undefined' && Crypto.prototype && !Crypto.prototype.randomUUID) {
          Crypto.prototype.randomUUID = generateUUID;
        }
      }
    })();
  </script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Cultural Islands</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #0d1117;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #f0f6fc;
    }

    #glcanvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    #status-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      background: rgba(22, 27, 34, 0.95);
      backdrop-filter: blur(8px);
      padding: 28px 36px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      max-width: 85%;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      transition: opacity 0.3s ease;
      z-index: 9999;
    }

    .hidden {
      display: none !important;
    }

    .spinner {
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top: 3px solid #58a6ff;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px auto;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    .error-title {
      color: #f85149;
      font-weight: 600;
      font-size: 1.1rem;
      margin-bottom: 8px;
    }

    .error-desc {
      font-size: 0.9rem;
      color: #8b949e;
      line-height: 1.4;
      word-break: break-word;
    }
  </style>
</head>

<body>
  <canvas id="glcanvas" tabindex="1"></canvas>

  <div id="status-overlay">
    <div id="spinner" class="spinner"></div>
    <div id="status-title" style="font-weight: 500;">Loading Cultural Islands...</div>
    <div id="status-desc" class="error-desc" style="margin-top: 6px;">Initializing WebGL canvas & WASM game engine</div>
  </div>

  <script>
    (function () {
      'use strict';

      function showStatusError(title, desc) {
        var overlay = document.getElementById("status-overlay");
        var spinner = document.getElementById("spinner");
        var titleEl = document.getElementById("status-title");
        var descEl = document.getElementById("status-desc");
        if (spinner) spinner.style.display = "none";
        if (titleEl) {
          titleEl.className = "error-title";
          titleEl.innerText = title;
        }
        if (descEl) descEl.innerText = desc;
        if (overlay) overlay.classList.remove("hidden");
      }

      function loadScript(src) {
        return new Promise(function (resolve) {
          var script = document.createElement("script");
          script.src = src;
          script.onload = function () { resolve(true); };
          script.onerror = function () { resolve(false); };
          document.head.appendChild(script);
        });
      }

      // Load quad-net.js and mq_js_bundle.js from root or static directory
      Promise.all([
        loadScript("quad-net.js").then(function (ok) { return ok || loadScript("static/quad-net.js"); }),
        loadScript("mq_js_bundle.js").then(function (ok) { return ok || loadScript("static/mq_js_bundle.js"); })
      ]).then(function () {
        if (typeof window.load === "function") {
          // Miniquad JS bundle loaded successfully
          var wasmCandidate = "cultural_islands_client.wasm";

          // Hide overlay once WebGL render starts
          var checkCanvas = setInterval(function () {
            var canvas = document.getElementById("glcanvas");
            if (canvas && canvas.width > 0 && canvas.height > 0) {
              var overlay = document.getElementById("status-overlay");
              if (overlay) overlay.classList.add("hidden");
              clearInterval(checkCanvas);
            }
          }, 500);

          // Execute miniquad load
          window.load(wasmCandidate);
        } else {
          showStatusError("Script Load Failure", "Could not load mq_js_bundle.js. Ensure static files are present in the web server directory.");
        }
      }).catch(function (err) {
        showStatusError("Initialization Error", err.message || "Failed to initialize game JS bundle.");
      });
    })();
  </script>
</body>

</html>
