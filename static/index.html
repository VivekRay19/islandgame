<!DOCTYPE html>
<html lang="en">

<head>
  <script>
    (function () {
      'use strict';
      function generateUUID() {
        return '10000000-1000-4000-8000-100000000000'.replace(/[018]/g, function (c) {
          return (c ^ (Math.random() * 16 >> (c / 4))).toString(16);
        });
      }

      try {
        var g = typeof globalThis !== 'undefined' ? globalThis : (typeof window !== 'undefined' ? window : self);
        if (!g.crypto) g.crypto = {};

        if (typeof g.crypto.randomUUID !== 'function') {
          try {
            Object.defineProperty(g.crypto, 'randomUUID', {
              value: generateUUID,
              configurable: true,
              writable: true,
              enumerable: true
            });
          } catch (e) {
            g.crypto.randomUUID = generateUUID;
          }
        }

        if (typeof window !== 'undefined') {
          window.crypto = g.crypto;
          if (typeof Crypto !== 'undefined' && Crypto.prototype) {
            try {
              Object.defineProperty(Crypto.prototype, 'randomUUID', {
                value: generateUUID,
                configurable: true,
                writable: true
              });
            } catch (e) { }
          }
        }
      } catch (err) {
        console.warn("[Polyfill] crypto.randomUUID patch notice:", err);
      }
    })();
  </script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Cultural Islands</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #0d1117;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #f0f6fc;
    }

    #glcanvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      outline: none;
    }

    #status-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      background: rgba(22, 27, 34, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 28px 36px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      max-width: 85%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      transition: opacity 0.4s ease, visibility 0.4s ease;
      z-index: 9999;
    }

    .hidden {
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }

    .spinner {
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top: 3px solid #58a6ff;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      animation: spin 0.9s cubic-bezier(0.6, 0.2, 0.4, 0.8) infinite;
      margin: 0 auto 16px auto;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <canvas id="glcanvas" tabindex="1"></canvas>

  <div id="status-overlay">
    <div id="spinner" class="spinner"></div>
    <div id="status-title" style="font-weight: 600; font-size: 1.1rem;">Loading Cultural Islands...</div>
    <div id="status-desc" style="font-size: 0.88rem; color: #8b949e; margin-top: 8px;">Initializing WebGL canvas &
      engine...</div>
  </div>

  <script>
    (function () {
      'use strict';

      function loadScript(src) {
        return new Promise(function (resolve) {
          var script = document.createElement("script");
          script.src = src;
          script.onload = function () { resolve(true); };
          script.onerror = function () { resolve(false); };
          document.head.appendChild(script);
        });
      }

      // Load Miniquad runtime script bundle without Vite dev tags
      Promise.all([
        loadScript("static/mq_js_bundle.js")
          .then(function (ok) { return ok || loadScript("mq_js_bundle.js"); })
          .then(function (ok) { return ok || loadScript("static/miniquad_js_bundle.js"); })
      ]).then(function () {
        if (typeof window.load === "function") {
          var wasmPath = "cultural_islands_client.wasm";
          fetch(wasmPath, { method: 'HEAD' }).then(function (res) {
            if (res.ok) {
              window.load(wasmPath);
            } else {
              window.load("static/cultural_islands_client.wasm");
            }
          }).catch(function () {
            window.load("static/cultural_islands_client.wasm");
          });
        } else {
          document.getElementById("status-title").innerText = "Script Initialization Error";
          document.getElementById("status-desc").innerText = "Failed to load mq_js_bundle.js from static directory.";
          document.getElementById("spinner").style.display = "none";
        }
      });
    })();
  </script>
</body>

</html>
