<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cultural Islands</title>

    <!-- Polyfill for crypto.randomUUID on non-HTTPS / HTTP IP environments -->
    <script>
        if (!window.crypto) {
            window.crypto = {};
        }
        if (!window.crypto.randomUUID) {
            window.crypto.randomUUID = function () {
                return '10000000-1000-4000-8000-100000000000'.replace(/[018]/g, function (c) {
                    var r = window.crypto.getRandomValues ? window.crypto.getRandomValues(new Uint8Array(1))[0] : Math.floor(Math.random() * 256);
                    return (c ^ (r & (15 >> (c / 4)))).toString(16);
                });
            };
        }
    </script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0e1f09;
            font-family: sans-serif;
        }
        #glcanvas {
            width: 100%;
            height: 100%;
            display: block;
            outline: none;
        }
    </style>
</head>
<body>
    <canvas id="glcanvas" tabindex='1'></canvas>

    <!-- Miniquad JS Glue Bundle -->
