<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cultural Islands</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><polygon points='50,5 95,27.5 95,72.5 50,95 5,72.5 5,27.5' fill='%231c5e21'/><text x='50' y='62' font-size='36' font-weight='bold' text-anchor='middle' fill='%23ffc800'>CI</text></svg>">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: #0e1f09;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    /* ── Splash screen ─────────────────────────────────────── */
    #splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: linear-gradient(160deg, #0e1f09 0%, #1b3a10 55%, #0e1f09 100%);
      transition: opacity 0.65s ease;
    }
    #splash.hidden { opacity: 0; pointer-events: none; }
    #splash.gone   { display: none; }

    .logo {
      font-size: 2.8rem; font-weight: 900; letter-spacing: 3px;
      color: #ffc800;
      text-shadow: 0 0 28px #ffc80066, 2px 3px 0 #3d2200;
      margin-bottom: 6px;
    }
    .sub {
      color: #c7bfab; font-size: 0.95rem; letter-spacing: 1px;
      margin-bottom: 36px;
    }

    /* Animated hex row */
    .hexrow { display: flex; gap: 10px; margin-bottom: 32px; }
    .hex {
      width: 46px; height: 52px;
      clip-path: polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);
      animation: hexbounce 1.5s ease-in-out infinite;
    }
    .hex:nth-child(1){ background:#3a7a20; animation-delay:0s   }
    .hex:nth-child(2){ background:#1c5e21; animation-delay:.18s }
    .hex:nth-child(3){ background:#1a75b5; animation-delay:.36s }
    .hex:nth-child(4){ background:#8a2bb0; animation-delay:.54s }
    .hex:nth-child(5){ background:#d98c2e; animation-delay:.72s }
    @keyframes hexbounce {
      0%,100% { transform: translateY(0)    scale(1.0);  opacity:.80 }
      50%      { transform: translateY(-9px) scale(1.07); opacity:1.0 }
    }

    /* Loading bar */
    .barwrap {
      width: 280px; height: 10px;
      background: #1a1008;
      border: 1.5px solid #8c591a;
      border-radius: 5px; overflow: hidden;
    }
    .bar {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #ffc800, #ff8f00);
      border-radius: 5px;
      animation: loadbar 2.4s ease-in-out forwards;
    }
    @keyframes loadbar { to { width: 100%; } }
    .status {
      color: #ffc800; font-size: 0.78rem;
      margin-top: 10px; letter-spacing: 1px;
    }

    /* Error box (shown on Phaser/JS crash) */
    #errbox {
      display: none; margin-top: 18px;
      padding: 10px 18px; max-width: 400px;
      background: #3a0808; border: 1px solid #8b0000;
      border-radius: 6px; color: #ff9999;
      font-size: 0.82rem; text-align: center;
    }

    /* Phaser canvas */
    #game-container canvas {
      display: block !important;
    }
    #game-container {
      width: 100vw; height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }
  </style>
</head>
<body>

  <!-- Splash shown while Phaser boots -->
  <div id="splash">
    <div class="logo">CULTURAL ISLANDS</div>
    <div class="sub">Island Development &amp; Survival</div>
    <div class="hexrow">
      <div class="hex"></div><div class="hex"></div><div class="hex"></div>
      <div class="hex"></div><div class="hex"></div>
    </div>
    <div class="barwrap"><div class="bar"></div></div>
    <div class="status" id="splash-status">Loading Phaser engine…</div>
    <div id="errbox"></div>
  </div>

  <!-- Phaser mounts its canvas here -->
  <div id="game-container"></div>

  <!-- Phaser 3 (served locally — no CDN needed on LAN) -->
  <script src="phaser.min.js"></script>

  <!-- Game modules loaded as ES modules -->
  <script type="module" src="js/main.js"></script>

  <script>
    const splash = document.getElementById('splash');
    const status = document.getElementById('splash-status');
    const errbox = document.getElementById('errbox');

    function hideSplash() {
      splash.classList.add('hidden');
      setTimeout(() => splash.classList.add('gone'), 700);
    }

    function showError(msg) {
      errbox.style.display = 'block';
      errbox.textContent   = '⚠ ' + String(msg).slice(0, 300);
      status.textContent   = 'Failed to start — check console (F12)';
    }

    // Surface JS / module errors in the splash
    window.addEventListener('error', e => showError(e.message));
    window.addEventListener('unhandledrejection', e => showError(e.reason));

    // Intercept console.error to catch Phaser internal failures
    const _origErr = console.error.bind(console);
    console.error = function(...a) {
      _origErr(...a);
      const m = a.join(' ');
      if (/phaser|webgl|failed/i.test(m)) showError(m.slice(0, 200));
    };

    // Phaser dispatches this event when the first scene is ready
    window.addEventListener('phaser-boot', hideSplash, { once: true });

    // Fallback: hide splash 4 s after page load regardless
    window.addEventListener('load', () => {
      status.textContent = 'Starting game…';
      setTimeout(() => {
        if (!splash.classList.contains('hidden')) hideSplash();
      }, 4000);
    });

    // Prevent right-click context menu on game canvas
    document.addEventListener('contextmenu', e => e.preventDefault());
  </script>
</body>
</html>
