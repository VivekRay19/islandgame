<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cultural Islands: Island Haat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b1522;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #e2e8f0;
    }
    #game-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #172a45 0%, #08111d 100%);
    }
    canvas {
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.08);
      border-radius: 8px;
    }
    #instructions-hint {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      color: rgba(255, 255, 255, 0.5);
      pointer-events: none;
      letter-spacing: 0.5px;
      text-shadow: 0 1px 2px rgba(0,0,0,0.8);
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <div id="instructions-hint">Cultural Islands: Island Haat Prototype • Controls: WASD / Arrow Keys to Move &bull; Mouse to Place / Interact &bull; R to Rotate</div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
